<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Riddle Me This</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
        />
        <link rel="stylesheet" href="./index.css" />
        <meta name="description" content="A riddle game" />

        <!-- Open Graph -->
        <meta property="og:type" content="website" />
        <meta
            property="og:url"
            content="https://mik1337.github.io/riddle-me-this/"
        />
        <meta property="og:site_name" content="Riddle Me This" />
        <meta property="og:title" content="Riddle Me This" />
        <meta property="og:description" content="A riddle game" />
        <meta
            property="og:image"
            content="https://mik1337.github.io/riddle-me-this/og_square.png"
        />
        <meta property="og:image:type" content="image/png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="1200" />
        <meta property="og:image:alt" content="Riddle Me This cover art" />

        <!-- Twitter / X (square image) -->
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:title" content="Riddle Me This" />
        <meta name="twitter:description" content="A riddle game" />
        <meta
            name="twitter:image"
            content="https://mik1337.github.io/riddle-me-this/og_square.png"
        />
        <meta name="twitter:image:alt" content="Riddle Me This cover art" />
    </head>

    <!-- style="linear-gradient(0deg, #44501B 0%, #44501B 100%), hsl(60deg 71.5557% 99.2037%);"  -->

    <body id="body" class="body bg-gradient">
        <audio id="music" autoplay loop>
            <!--<source src="./assets/tatamusic-game-game-music-599001.mp3" type="audio/mpeg">-->
            <source src="./assets/arpmedia-retro-arcade-game-music-577821.mp3" type="audio/mpeg">
            <!--<source src="./assets/miksmusic.mp3" type="audio/mpeg">-->
        </audio>
        <section id="menu" class="glass-bg">
            <div class="menu--options-container">
                <img src="og_square.png" width="700" height="auto" />
                <div class="menu--items">
                    <span class="menu--option-container">
                        <p class="font-body">Menu</p>
                        <p class="help-text"></p>
                    </span>
                    <span class="menu--option-container">
                        <p class="font-body" id="just-riddles">Just Riddles</p>
                        <p class="help-text"></p>
                    </span>
                    <span class="menu--option-container">
                        <p class="font-body">Create Room</p>
                        <p class="help-text"></p>
                    </span>
                    <span class="menu--option-container">
                        <p class="font-body">Credits</p>
                        <p class="help-text"></p>
                    </span>
                    <span class="menu--option-container">
                        <p class="font-body">All Riddles</p>
                        <p class="help-text"></p>
                    </span>
                    <span class="menu--option-container">
                        <p class="font-body">Music</p>
                        <p class="font-body">Sound</p>
                    </span>
                </div>
            </div>
        </section>
        <section id="canvas" class="glass-bg">
            <div class="info-row font-display">
                <p id="back" class="">Back</p>
                <p id="rounds" class="animate__animated animate__flash">
                    #12
                </p>
                <p id="skip" class="">Skip</p>
            </div>

            <div id="game" class="animate__animated animate__backInDown">
                <p id="hint" class="rubik-doodle-shadow-regular">Hint</p>
                <p id="riddle" class="font-body">
                    RIDDLE
                </p>
                <div class="answer-cover ">
                    <p id="answer" class="font-normal"></p>
                    <p class="cover font-body"></p>
                </div>
            </div>

            <div class="info-row font-display">
                <p id="number" class="animate__animated animate__flash">
                    #12
                </p>
                <p id="next">Next</p>
            </div>
        </section>

        <script type="module" src="./index.js"></script>
    </body>
</html>
