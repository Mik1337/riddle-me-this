<html lang="en">

<head>
	<title>Riddle Me This</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>


<body id="body" class="relative max-w-screen overflow-x-hidden h-full bg-gray-900 flex flex-col items-center pt-8 p-4 lg:p-10 gap-4 lg:gap-10 justify-center w-full">
	<h4 id="number"
		class="animate__animated animate__flash absolute top-1 left-4 lg:left-10 font-medium opacity-60 text-white text-base">#12</h4>
	<div id="easy"
		class="transition ease-in-out animate__animated animate__fadeIn relative flex flex-col items-center justify-center rounded-xl h-full w-full bg-yellow-900">
		<span class="absolute top-0 right-0 text-xl font-semibold text-ink-muted">
			<i class="fas fa-cloud"></i>
		</span>
		<h3 id="hint" class="text-center text-base lg:text-lg font-medium tracking-widest">Has "NN"</h3>

		<h2 id="question" class="text-center text-xl font-bold tracking-wider">Hint</h2>
		<p id="answer" class="text-center absolute bottom-2 font-bold opacity-50 rotate-180">Ans</p>
	</div>
	<div id="normal"
		class="animate__animated animate__fadeIn  relative flex flex-col items-center justify-center rounded-xl h-full w-full bg-red-900">
		<h3 id="hint" class="text-center lg:text-lg font-medium tracking-widest">Has "NN"</h3>
		<h2 id="question" class="text-center text-lg lg:text-xl font-bold tracking-wider">Hint</h2>
		<p id="answer" class="text-center absolute bottom-2 font-bold opacity-50 rotate-180">Ans</p>
	</div>
	<div id="hard"
		class="animate__animated animate__fadeIn relative flex flex-col items-center justify-center rounded-xl h-full w-full bg-purple-900">
		<h3 id="hint" class="text-center lg:text-lg font-medium tracking-widest">Has "NN"</h3>
		<h2 id="question" class="text-center text-lg lg:text-xl font-bold tracking-wider">Contains "PL"</h2>
		<p id="answer" class="text-center absolute bottom-2 font-bold opacity-50 rotate-180">Ans</p>
	</div>

	<div id="btns"
		class="transition duration-150 ease-in-out hover:scale-[100.5%] active:scale-100 h-40 flex items-center justify-center w-full bg-white">
		<button id="shuffle" class="font-medium tracking-wide">Riddle Me This</button>
	</div>

	<script type="module" src="./index.js"></script>
</body>

</html>
