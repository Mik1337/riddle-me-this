<html lang="en">

<head>
	<title>Riddle Me This</title>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
	<link rel="stylesheet" href="./index.css" />
	<meta name="description" content="A riddle game" />

	<!-- Open Graph -->
	<meta property="og:type" content="website" />
	<meta property="og:url" content="https://mik1337.github.io/riddle-me-this/" />
	<meta property="og:site_name" content="Riddle Me This" />
	<meta property="og:title" content="Riddle Me This" />
	<meta property="og:description" content="A riddle game" />
	<meta property="og:image" content="https://mik1337.github.io/riddle-me-this/og_square.png" />
	<meta property="og:image:type" content="image/png" />
	<meta property="og:image:width" content="1200" />
	<meta property="og:image:height" content="1200" />
	<meta property="og:image:alt" content="Riddle Me This cover art" />

	<!-- Twitter / X (square image) -->
	<meta name="twitter:card" content="summary" />
	<meta name="twitter:title" content="Riddle Me This" />
	<meta name="twitter:description" content="A riddle game" />
	<meta name="twitter:image" content="https://mik1337.github.io/riddle-me-this/og_square.png" />
	<meta name="twitter:image:alt" content="Riddle Me This cover art" />
</head>

<!-- style="linear-gradient(0deg, #44501B 0%, #44501B 100%), hsl(60deg 71.5557% 99.2037%);"  -->

<body id="body"
	class="body bg-gradient">
	<section id="canvas" class="canvas">
		<ul class="info-row">
			<li></li>	
			<li id="rounds" class="animate__animated animate__flash">
				#12
			</li>
			<li id="skip">Skip</li>	
		</ul>

		<ul class="que-cards">
			<li id="easy"
				class="que-card transition ease-in-out animate__animated animate__fadeIn rounded-xl h-full w-full">
				<h3 id="hint" class="text-base lg:text-lg font-medium tracking-widest">
					Hint
				</h3>
				<h2 id="riddle" class="text-xl font-bold tracking-wider">
					Riddle
				</h2>
				<div class="answer-cover">
					<p id="answer"></p>
					<p class="cover">
						Hover to reveal
					</p>
				</div>
				
			</li>
			<li id="normal"
				class="que-card animate__animated animate__fadeIn relative flex flex-col items-center justify-center rounded-xl h-full w-full ">
				<h3 id="hint" class="text-center lg:text-lg font-medium tracking-widest">
					Hint
				</h3>
				<h2 id="riddle" class="text-center text-lg lg:text-xl font-bold tracking-wider">
					Riddle
				</h2>
				<div class="answer-cover">
					<p id="answer"></p>
					<p class="cover">
						Hover to reveal
					</p>
				</div>
			</li>
			<li id="hard"
				class="que-card animate__animated animate__fadeIn relative flex flex-col items-center justify-center rounded-xl h-full w-full">
				<h3 id="hint" class="text-center lg:text-lg font-medium tracking-widest">
					Hint"
				</h3>
				<h2 id="riddle" class="text-center text-lg lg:text-xl font-bold tracking-wider">
					Riddle
				</h2>
				<div class="answer-cover">
					<p id="answer"></p>
					<p class="cover">
						Hover to reveal
					</p>
				</div>
			</li>
		</ul>
		
		<ul class="info-row">
			<li id="number" class="animate__animated animate__flash">
				#12
			</li>
			<li id="skip">Next</li>	
		</ul>

	</section>

	<script type="module" src="./index.js"></script>
</body>

</html>
