<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Riddle Me This</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
        />
        <link rel="stylesheet" href="./index.css" />
        <meta name="description" content="A riddle game" />

        <!-- Open Graph -->
        <meta property="og:type" content="website" />
        <meta
            property="og:url"
            content="https://mik1337.github.io/riddle-me-this/"
        />
        <meta property="og:site_name" content="Riddle Me This" />
        <meta property="og:title" content="Riddle Me This" />
        <meta property="og:description" content="A riddle game" />
        <meta
            property="og:image"
            content="https://mik1337.github.io/riddle-me-this/og_square.png"
        />
        <meta property="og:image:type" content="image/png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="1200" />
        <meta property="og:image:alt" content="Riddle Me This cover art" />

        <!-- Twitter / X (square image) -->
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:title" content="Riddle Me This" />
        <meta name="twitter:description" content="A riddle game" />
        <meta
            name="twitter:image"
            content="https://mik1337.github.io/riddle-me-this/og_square.png"
        />
        <meta name="twitter:image:alt" content="Riddle Me This cover art" />
    </head>

    <!-- style="linear-gradient(0deg, #44501B 0%, #44501B 100%), hsl(60deg 71.5557% 99.2037%);"  -->

    <body id="body" class="body bg-gradient">
        <audio id="music" autoplay loop>
             <source src="./assets/tatamusic-game-game-music-599001.mp3" type="audio/mpeg">
             <!--<source src="./assets/arpmedia-retro-arcade-game-music-577821.mp3" type="audio/mpeg">-->
        </audio>
        <section id="canvas" class="canvas">
            <ul class="info-row font-display">
                <li></li>
                <li id="rounds" class="animate__animated animate__flash">
                    #12
                </li>
                <li id="skip">Skip</li>
            </ul>

            <div id="game">
                <p id="hint" class="font-80s-fade">Hint</p>
                <p id="riddle" class="font-display">
                    RIDDLE
                </p>
                <div class="answer-cover">
                    <p id="answer"></p>
                    <p class="cover"></p>
                </div>
            </div>

            <ul class="info-row font-display">
                <li id="number" class="animate__animated animate__flash">
                    #12
                </li>
                <li id="skip">Next</li>
            </ul>
        </section>

        <script type="module" src="./index.js"></script>
    </body>
</html>
